plugins {
    id 'com.android.application'
}

// The APK holds no database credentials. It only knows the analytics server address.
// Default = this computer's LAN address at build time; it can be changed inside the app.
def lanAddress() {
    try {
        for (ni in Collections.list(NetworkInterface.getNetworkInterfaces())) {
            if (!ni.isUp() || ni.isLoopback() || ni.isVirtual()) continue
            def name = (ni.displayName ?: '').toLowerCase()
            if (name.contains('virtual') || name.contains('vmware') || name.contains('hyper-v') || name.contains('vethernet') || name.contains('wsl') || name.contains('docker')) continue
            for (addr in Collections.list(ni.getInetAddresses())) {
                if (addr instanceof Inet4Address && addr.isSiteLocalAddress()) return addr.hostAddress
            }
        }
    } catch (ignored) { }
    return '192.168.1.2'
}
// Settings come from android/.env (copy .env.example). Only these keys are read; the
// backend .env with the database password and access key is never touched by this build.
def ENV_KEYS_FOR_APK = ['APP_NAME', 'SERVER_URL', 'SERVER_PORT']
def dotenv = [:]
def envFile = rootProject.file('.env')
if (envFile.exists()) {
    envFile.eachLine('UTF-8') { line ->
        def m = line =~ /^\s*([A-Z_]+)\s*=\s*(.*?)\s*$/
        if (m.matches() && ENV_KEYS_FOR_APK.contains(m.group(1))) dotenv[m.group(1)] = m.group(2)
    }
}
def setting = { String key, String fallback -> System.getenv(key) ?: (dotenv[key] ?: fallback) }

def appName = setting('APP_NAME', 'MRPanalytics')
def serverPort = setting('SERVER_PORT', '4100')
def defaultServer = setting('SERVER_URL', "http://${lanAddress()}:${serverPort}")

// The analytics UI is bundled into the APK: frontend/src is copied to assets/ui with the app
// name filled in, and config.js makes the UI call /api, which the app forwards to SERVER_URL.
def uiAssetsDir = layout.buildDirectory.dir('generated/uiAssets')
def escHtml = { String s -> s.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('"', '&quot;') }
def bundleWebUi = tasks.register('bundleWebUi', Copy) {
    def src = rootProject.file('../frontend/src')
    inputs.property('appName', appName)
    from(src) { include '*.html', '*.js', '*.css' }
    into(uiAssetsDir.map { it.dir('ui') })
    filter { String line -> line.replace('{{APP_NAME}}', escHtml(appName)).replace('{{APP_INITIAL}}', escHtml(appName.substring(0, 1).toUpperCase())) }
    doFirst {
        if (!new File(src, 'index.html').exists()) throw new GradleException("frontend/src/index.html not found next to android/: the UI cannot be bundled")
    }
    doLast {
        def cfg = [appName: appName, apiUrl: '']
        new File(uiAssetsDir.get().dir('ui').asFile, 'config.js').setText("window.MRP_CONFIG = ${groovy.json.JsonOutput.toJson(cfg)};\n", 'UTF-8')
    }
}
tasks.named('preBuild') { dependsOn bundleWebUi }

def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.itsolution.prathamanalytics'
    compileSdk 35

    defaultConfig {
        applicationId 'com.itsolution.prathamanalytics'
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName '1.8.0'
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"' + defaultServer + '"'
        resValue 'string', 'app_name', appName
        // Test copies: `gradlew assembleRelease -PtestSuffix=.test` installs next to the real app.
        if (project.hasProperty('testSuffix')) applicationIdSuffix project.property('testSuffix')
    }

    signingConfigs {
        release {
            if (keystoreProps.getProperty('storeFile')) {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig keystoreProps.getProperty('storeFile') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDirs += [uiAssetsDir.get().asFile]
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
