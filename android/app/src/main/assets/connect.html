<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Connect</title>
  <style>
    :root { color-scheme: light; --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781; --border: rgba(11,11,11,.12); --accent: #2a78d6; --critical: #d03b3b; }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7; --muted: #898781; --border: rgba(255,255,255,.12); --accent: #3987e5; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--page); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; }
    .mark { width: 48px; height: 48px; border-radius: 12px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; margin-bottom: 14px; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { margin: 0 0 16px; color: var(--ink-2); font-size: 14px; line-height: 1.45; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--border); background: var(--page); color: var(--ink); padding: 0 12px; font-size: 16px; }
    input:focus { outline: none; border-color: var(--accent); }
    button { width: 100%; height: 46px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; margin-top: 14px; }
    .link { background: none; color: var(--ink-2); font-weight: 500; margin-top: 6px; height: 40px; }
    .error { display: none; background: color-mix(in srgb, var(--critical) 12%, transparent); color: var(--critical); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 14px; }
    .hint { font-size: 12.5px; color: var(--muted); margin-top: 14px; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">M</div>
    <h1>Data server</h1>
    <p>The app shows its screens itself and loads MRPscan data from this server.</p>
    <div class="error" id="error"></div>
    <label for="url">Server address</label>
    <input id="url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://analytics.mrpscan.com" />
    <button id="go">Connect</button>
    <button id="reset" class="link">Use default address</button>
    <div class="hint">Use the address of the MRPanalytics backend, for example <b>https://analytics.mrpscan.com</b>. The server needs its database settings for data to appear.</div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const shell = window.MRPscanShell;
    const input = document.getElementById('url');
    input.value = params.get('server') || (shell ? shell.getServerUrl() : '');
    const err = params.get('error');
    if (err) { const e = document.getElementById('error'); e.textContent = 'Could not reach the server (' + err + '). Check the address and that the server is running.'; e.style.display = 'block'; }
    document.getElementById('go').addEventListener('click', () => shell && shell.connect(input.value));
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') shell && shell.connect(input.value); });
    document.getElementById('reset').addEventListener('click', () => { if (shell) { input.value = shell.getDefaultServerUrl(); shell.connect(input.value); } });
  </script>
</body>
</html>
