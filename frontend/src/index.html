<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#fbf7f0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" />
  <title>{{APP_NAME}}</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="lead">
        <a class="back-btn" href="#/" aria-label="Back to all users"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>
        <a class="brand" href="#/">
          <span class="brand-mark">{{APP_INITIAL}}</span>
          <span class="brand-text"><span class="brand-title">{{APP_NAME}}</span></span>
        </a>
        <span class="top-title">User details</span>
      </div>
      <form class="search" id="searchForm" role="search" autocomplete="off">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Search by phone number or name" aria-label="Search users by phone number or name" />
      </form>
      <button type="button" id="serverBtn" class="icon-btn hidden" aria-label="Change server">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
      </button>
      <nav class="cats" id="cats" aria-label="User categories"></nav>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

  </div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script src="config.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
